<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">Guess Who? course sequence</title>
  <desc id="d">Unit 0 foundations for two weeks, then partner work under consent and privacy guidelines, then the final project, graded across six checkpoints.</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="80" y="130" font-family="'Libre Baskerville', Georgia, serif" font-size="44" fill="#161416">How the course is sequenced</text>
  <text x="80" y="178" font-family="Geist, system-ui, sans-serif" font-size="22" fill="#5f5a5f">Ethics and consent come before anyone tells a classmate’s story.</text>
  <g font-family="Geist, system-ui, sans-serif">
    <line x1="80" y1="250" x2="420" y2="250" stroke="#6b2d5c" stroke-width="4"/>
    <line x1="440" y1="250" x2="780" y2="250" stroke="#161416" stroke-width="2"/>
    <line x1="800" y1="250" x2="1120" y2="250" stroke="#161416" stroke-width="2"/>
    <g font-size="18" fill="#6b2d5c"><text x="80" y="290">Unit 0 · 2 weeks</text></g>
    <g font-size="18" fill="#5f5a5f"><text x="440" y="290">Partner work</text><text x="800" y="290">Final project</text></g>
  </g>
  <g font-family="'Libre Baskerville', Georgia, serif" font-size="28" fill="#161416">
    <text x="80" y="340">Foundations of Identity</text><text x="80" y="378">and Representation</text>
    <text x="440" y="340">Consent and privacy</text><text x="440" y="378">guidelines first</text>
    <text x="800" y="340">Identity card and</text><text x="800" y="378">presentation</text>
  </g>
  <g font-family="Geist, system-ui, sans-serif" font-size="20" fill="#5f5a5f">
    <text x="440" y="420">Right not to share · right to correct</text>
    <text x="440" y="448">Alternative assignment available</text>
    <text x="800" y="420">About a classmate, with</text>
    <text x="800" y="448">their consent</text>
  </g>
  <g font-family="Geist, system-ui, sans-serif">
    <text x="80" y="535" font-size="18" fill="#5f5a5f">Graded in six checkpoints, not one final submission</text>
    <line x1="80" y1="580" x2="1120" y2="580" stroke="#e4dfda" stroke-width="2"/>
    <g fill="#ffffff" stroke="#6b2d5c" stroke-width="3">
      <circle cx="90" cy="580" r="10"/><circle cx="296" cy="580" r="10"/><circle cx="502" cy="580" r="10"/>
      <circle cx="708" cy="580" r="10"/><circle cx="914" cy="580" r="10"/>
    </g>
    <circle cx="1110" cy="580" r="10" fill="#6b2d5c"/>
    <text x="1120" y="625" font-size="18" fill="#5f5a5f" text-anchor="end">Final presentation</text>
  </g>
</svg>
