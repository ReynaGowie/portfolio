<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">Fictional approval screen for an AI travel assistant</title>
  <desc id="d">Two steps. Compare flight options: done automatically. Buy a nonrefundable ticket: waiting for approval, with Approve and Edit buttons.</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="80" y="96" font-family="Geist, system-ui, sans-serif" font-size="18" fill="#5f5a5f">Fictional interface, not a real product</text>
  <rect x="80" y="125" width="1040" height="470" rx="8" fill="#ffffff" stroke="#e4dfda" stroke-width="2"/>
  <text x="120" y="190" font-family="'Libre Baskerville', Georgia, serif" font-size="32" fill="#161416">Your assistant’s plan</text>
  <line x1="80" y1="225" x2="1120" y2="225" stroke="#e4dfda" stroke-width="2"/>
  <g font-family="Geist, system-ui, sans-serif">
    <circle cx="140" cy="290" r="18" fill="#ffffff" stroke="#6b2d5c" stroke-width="3"/>
    <path d="M131 290 l6 7 12 -14" fill="none" stroke="#6b2d5c" stroke-width="3"/>
    <text x="180" y="282" font-size="24" fill="#161416">Compare flight options</text>
    <text x="180" y="314" font-size="19" fill="#5f5a5f">Nothing booked · easy to redo · done automatically</text>
    <line x1="80" y1="360" x2="1120" y2="360" stroke="#e4dfda" stroke-width="2"/>
    <rect x="81" y="361" width="1038" height="233" fill="#f1e7ee"/>
    <circle cx="140" cy="425" r="18" fill="#6b2d5c"/>
    <text x="140" y="433" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="600">?</text>
    <text x="180" y="418" font-size="24" fill="#161416">Buy a nonrefundable ticket</text>
    <text x="180" y="450" font-size="19" fill="#5f5a5f">Costs money · hard to undo · waiting for you</text>
    <rect x="180" y="490" width="140" height="46" rx="4" fill="#6b2d5c"/>
    <text x="250" y="520" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="500">Approve</text>
    <rect x="336" y="490" width="140" height="46" rx="4" fill="#ffffff" stroke="#6b2d5c" stroke-width="2"/>
    <text x="406" y="520" font-size="19" fill="#6b2d5c" text-anchor="middle" font-weight="500">Edit first</text>
  </g>
</svg>
