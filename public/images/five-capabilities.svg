<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">Five capabilities a degree should signal</title>
  <desc id="d">Understand, question, judge, create, contribute.</desc>
  <rect width="1200" height="675" fill="#faf7f2"/>
  <text x="80" y="130" font-family="Georgia, serif" font-size="42" fill="#1c1a1a">What should a degree signal?</text>
  <text x="80" y="178" font-family="system-ui, sans-serif" font-size="22" fill="#5c5650">Five capabilities from “What Should a Penn State Degree Mean Now?”</text>
  <g font-family="Georgia, serif" font-size="30" text-anchor="middle">
    <rect x="80" y="270" width="184" height="200" rx="10" fill="#5b2a4e"/><text x="172" y="380" fill="#fff">Understand</text>
    <rect x="284" y="270" width="184" height="200" rx="10" fill="#fff" stroke="#5b2a4e" stroke-width="3"/><text x="376" y="380" fill="#1c1a1a">Question</text>
    <rect x="488" y="270" width="184" height="200" rx="10" fill="#5b2a4e"/><text x="580" y="380" fill="#fff">Judge</text>
    <rect x="692" y="270" width="184" height="200" rx="10" fill="#fff" stroke="#5b2a4e" stroke-width="3"/><text x="784" y="380" fill="#1c1a1a">Create</text>
    <rect x="896" y="270" width="224" height="200" rx="10" fill="#5b2a4e"/><text x="1008" y="380" fill="#fff">Contribute</text>
  </g>
</svg>
